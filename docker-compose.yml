x-app: &app
  build: .
  image: currency-rates:local
  restart: unless-stopped
  environment:
    POSTGRES_DSN: postgresql+asyncpg://rates:rates@postgres:5432/rates
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_USER: rates
    CLICKHOUSE_PASSWORD: rates
    CLICKHOUSE_DATABASE: rates
  depends_on:
    migrate:
      condition: service_completed_successfully
    clickhouse:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rates
      POSTGRES_PASSWORD: rates
      POSTGRES_DB: rates
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rates", "-d", "rates"]
      interval: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: rates
      CLICKHOUSE_PASSWORD: rates
      CLICKHOUSE_DB: rates
    ports:
      - "${CLICKHOUSE_HOST_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8123/ping"]
      interval: 2s
      retries: 30

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "currency_rates.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"

  grpc:
    <<: *app
    command: ["python", "-m", "currency_rates.api.grpc_server"]
    ports:
      - "50051:50051"

  worker:
    <<: *app
    command: ["python", "-m", "currency_rates.ingestion.worker"]

volumes:
  postgres-data:
  clickhouse-data:
